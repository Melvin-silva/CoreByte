<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreByte - Acessar a Conta</title>
    <link rel="stylesheet" href="/static/css/Login.css">
</head>
<body>
    <div class="login-screen-central">
        <main class="container-box login-container">
            <section class="form-wrapper">
                <div class="logo-container">
                    <img src="/static/img/Corebyte.png" alt="CoreByte Logo" class="corebyte-logo">
                </div>

                <h2>Acesse a sua Conta</h2>
                <p class="desc-text">Insira os seus dados para entrar na plataforma.</p>

                <p id="login-error" class="form-error" hidden>Credenciais incorretas. Use o e-mail e a senha cadastrados.</p>

                <form id="login-form" method="post" action="/login/">
                    {% csrf_token %}
                    <div class="field-container">
                        <input type="email" name="email" placeholder="E-mail, CPF ou CNPJ" required>
                    </div>

                    <div class="field-container">
                        <input type="password" name="senha" placeholder="Sua senha" required>
                    </div>

                    <div class="terms-check">
                        <input type="checkbox" id="remember-me">
                        <label for="remember-me">Lembrar de mim neste dispositivo</label>
                    </div>

                    <button type="submit" class="btn-login-verde">ENTRAR</button>
                    <a href="/cadastro/" class="btn-login-borda" id="go-cadastro">CRIAR CONTA</a>
                </form>
            </section>

            <section class="banner-wrapper">
                <div class="banner-info">
                    <p class="tagline">NIVELADO PARA</p>
                    <h1>VENCER</h1>
                    <div class="neon-line"></div>
                    <p class="sub-desc">Equipamentos de elite para quem nao aceita o segundo lugar.</p>
                </div>
            </section>
        </main>
    </div>
    <script>
    const loginError = document.getElementById('login-error');
    const isStaticPreview = window.location.protocol === 'file:' || window.location.pathname.toLowerCase().includes('/templates/');

    if (new URLSearchParams(window.location.search).get('erro') === 'credenciais') {
        loginError.hidden = false;
    }

    document.getElementById('go-cadastro').addEventListener('click', function(event) {
        if (isStaticPreview) {
            event.preventDefault();
            window.location.href = 'cadastro.html';
        }
    });

    document.getElementById('login-form').addEventListener('submit', function(event) {
        const email = this.elements.email.value.trim();
        const senha = this.elements.senha.value;

        if (!email || !senha) {
            event.preventDefault();
            loginError.textContent = 'Informe e-mail e senha para entrar.';
            loginError.hidden = false;
            return;
        }

        if (isStaticPreview) {
            event.preventDefault();
            const emailCadastrado = localStorage.getItem('corebyte_email_cadastrado');
            const senhaCadastrada = localStorage.getItem('corebyte_senha_cadastrada');
            const nomeCadastrado = localStorage.getItem('corebyte_nome_cadastrado');

            if (email !== emailCadastrado || senha !== senhaCadastrada) {
                loginError.textContent = 'Credenciais incorretas. Use o e-mail e a senha cadastrados.';
                loginError.hidden = false;
                return;
            }

            localStorage.setItem('corebyte_usuario_logado', email);
            localStorage.setItem('corebyte_usuario_nome', nomeCadastrado || email.split('@')[0]);
            window.location.href = 'index.html';
        }
    });
    </script>
</body>
</html>
