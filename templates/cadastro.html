<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreByte - Criar Conta</title>
    <link rel="stylesheet" href="/static/css/cadastro.css">
</head>
<body>
    <div class="cadastro-screen">
        <main class="container-box cadastro-container">
            <section class="form-wrapper">
                <div class="logo-container">
                    <img src="/static/img/Corebyte.png" alt="CoreByte Logo" class="corebyte-logo">
                </div>

                <h2>Crie a sua Conta</h2>
                <p class="desc-text">Preencha os campos abaixo para se registrar na plataforma.</p>

                <p id="cadastro-error" class="form-error" hidden>As senhas nao coincidem. Por favor, verifique.</p>

                <form id="cadastro-form" method="post" action="/cadastro/">
                    <div class="field-container">
                        <input type="text" name="nome" placeholder="Nome completo" required>
                    </div>

                    <div class="field-container">
                        <input type="email" name="email" placeholder="Seu e-mail principal" required>
                    </div>

                    <div class="field-container">
                        <input type="password" name="senha" placeholder="Crie uma senha forte" required>
                    </div>

                    <div class="field-container">
                        <input type="password" name="confirmar_senha" placeholder="Confirme a sua senha" required>
                    </div>

                    <div class="terms-check">
                        <input type="checkbox" id="accept-terms" required>
                        <label for="accept-terms">Li e aceito os Termos de Servico</label>
                    </div>

                    <button type="submit" class="btn-cadastro-verde">CONCLUIR CADASTRO</button>
                    <button type="button" class="btn-cadastro-borda" id="go-login">JA TENHO CONTA</button>
                </form>
            </section>

            <section class="banner-wrapper">
                <div class="banner-info">
                    <p class="tagline">NIVELADO PARA</p>
                    <h1>VENCER</h1>
                    <div class="neon-line"></div>
                    <p class="sub-desc">Junte-se a nossa comunidade e monte o setup dos seus sonhos.</p>
                </div>
            </section>
        </main>
    </div>
    <script>
    document.getElementById('go-login').addEventListener('click', function() {
        if (window.location.port && window.location.port !== '8000') {
            window.location.href = '/templates/Login.html';
        } else {
            window.location.href = '/login/';
        }
    });

    document.getElementById('cadastro-form').addEventListener('submit', function(event) {
        const senha = this.elements.senha.value;
        const confirmarSenha = this.elements.confirmar_senha.value;

        if (senha !== confirmarSenha) {
            event.preventDefault();
            document.getElementById('cadastro-error').hidden = false;
            return;
        }

        if (window.location.port && window.location.port !== '8000') {
            event.preventDefault();
            const nome = this.elements.nome.value.trim();
            const email = this.elements.email.value.trim();

            localStorage.setItem('corebyte_nome_cadastrado', nome || email.split('@')[0]);
            localStorage.setItem('corebyte_email_cadastrado', email);
            localStorage.setItem('corebyte_senha_cadastrada', senha);
            localStorage.removeItem('corebyte_usuario_logado');
            localStorage.removeItem('corebyte_usuario_nome');

            alert('Cadastro concluido com sucesso! Entre com sua conta para confirmar.');
            window.location.href = '/templates/Login.html';
        }
    });
    </script>
</body>
</html>
