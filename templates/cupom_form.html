<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} | CoreByte</title>
    <link rel="stylesheet" href="/static/css/cupom.css?v=20260614">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="coupon-header">
        <div class="header-main">
            <a class="logo" href="/" aria-label="Ir para a tela inicial">
                <img src="/static/img/Corebyte.png" alt="CoreByte">
            </a>

            <div class="header-title">
                <span>Area do gerente</span>
                <strong>{{ titulo }}</strong>
            </div>

            <nav class="header-actions" aria-label="Acoes de cupom">
                <a class="nav-button" href="{% url 'cupom_lista' %}">Voltar</a>
            </nav>
        </div>
    </header>

    <main class="coupon-page narrow">
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <p class="message {{ message.tags }}">{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <section class="form-panel">
            <span class="eyebrow">CoreByte Admin</span>
            <h1>{{ titulo }}</h1>
            <p>{{ subtitulo }}</p>

            <form method="post" class="coupon-form">
                {% csrf_token %}
                {{ form.non_field_errors }}

                <label>
                    Codigo do cupom
                    {{ form.codigo }}
                    {{ form.codigo.errors }}
                </label>

                <label>
                    Desconto percentual
                    {{ form.desconto_percentual }}
                    {{ form.desconto_percentual.errors }}
                </label>

                <label>
                    Validade
                    {{ form.validade }}
                    {{ form.validade.errors }}
                </label>

                <label class="check-row">
                    {{ form.ativo }}
                    <span>Cupom ativo</span>
                    {{ form.ativo.errors }}
                </label>

                <div class="form-actions">
                    <button type="submit">{{ botao }}</button>
                    <a href="{% url 'cupom_lista' %}">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
